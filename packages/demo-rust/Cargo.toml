[package]
name = "codec-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI bench for the Codec wire format (Rust). Mirrors demo-dotnet, demo-python, demo-c, demo-web."
repository = "https://github.com/wdunn001/Codec"
publish = false

[[bin]]
name = "codec-bench"
path = "src/main.rs"

[dependencies]
codec-rs = { path = "../rust", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
bytes = "1"
flate2 = "1"
brotli = "7"
zstd = "0.13"
futures-util = "0.3"
