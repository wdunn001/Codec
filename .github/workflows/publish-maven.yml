# Publish `io.github.wdunn001:codec` to Maven Central on a v* tag, or
# manually from the Actions tab.
#
# Required secrets (configure under repo Settings → Secrets and
# variables → Actions):
#   MAVEN_USERNAME      Sonatype OSSRH username
#   MAVEN_CENTRAL_TOKEN Sonatype OSSRH user token (NOT the password)
#   MAVEN_GPG_PRIVATE_KEY  ASCII-armored GPG private key for signing
#   MAVEN_GPG_PASSPHRASE   Passphrase for the GPG key
#
# Sonatype's staging pipeline can take 10-60 min to propagate to
# search.maven.org after release; the workflow only confirms the
# `mvn deploy` upload, not the post-staging propagation.

name: publish-maven

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Test
        run: mvn -q test

      - name: Deploy
        run: mvn -q -P release deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
