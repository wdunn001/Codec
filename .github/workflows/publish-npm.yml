# Publish the npm packages on a v* tag, or manually from the Actions
# tab. Manual dispatch lets you republish a specific package without
# re-tagging the whole repo.
#
# Required secret: `NPM_TOKEN` (Automation token from
# https://www.npmjs.com/settings/<user>/tokens — "Automation" type,
# scoped to the @codecai org if possible).
#
# Each package publishes one at a time so a failure halts the cascade
# rather than partially publishing the set.

name: publish-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to publish (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, web, web-safety, web-llm, maps-cli, mcp-leaf, tool-kit]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@codecai"

      - name: Install (workspace-aware)
        run: npm ci --workspaces --include-workspace-root || npm install

      # ── @codecai/web ────────────────────────────────────────────────
      - name: Build @codecai/web
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web' }}
        run: npm run -w @codecai/web build

      - name: Test @codecai/web
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web' }}
        run: npm test -w @codecai/web

      - name: Publish @codecai/web
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web' }}
        # Idempotent publish: skip if the version is already on the registry.
        # Lets workflow_dispatch re-runs succeed cleanly when a prior tag-push
        # already published one or more of the @codecai/* family. The 403
        # "previously published versions" error npm returns is the failure
        # this guard short-circuits.
        run: |
          v=$(node -p "require('./packages/web/package.json').version")
          if npm view @codecai/web@$v version 2>/dev/null | grep -q "^$v$"; then
            echo "@codecai/web@$v already on npm — skipping"
          else
            npm publish --access public -w @codecai/web
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── @codecai/web-safety ────────────────────────────────────────
      - name: Build @codecai/web-safety
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web-safety' }}
        run: npm run -w @codecai/web-safety build

      - name: Test @codecai/web-safety
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web-safety' }}
        run: npm test -w @codecai/web-safety

      - name: Publish @codecai/web-safety
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web-safety' }}
        run: |
          v=$(node -p "require('./packages/web-safety/package.json').version")
          if npm view @codecai/web-safety@$v version 2>/dev/null | grep -q "^$v$"; then
            echo "@codecai/web-safety@$v already on npm — skipping"
          else
            npm publish --access public -w @codecai/web-safety
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── @codecai/web-llm ───────────────────────────────────────────
      - name: Build @codecai/web-llm
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web-llm' }}
        run: npm run -w @codecai/web-llm build

      - name: Test @codecai/web-llm
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web-llm' }}
        run: npm test -w @codecai/web-llm

      - name: Publish @codecai/web-llm
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'web-llm' }}
        run: |
          v=$(node -p "require('./packages/web-llm/package.json').version")
          if npm view @codecai/web-llm@$v version 2>/dev/null | grep -q "^$v$"; then
            echo "@codecai/web-llm@$v already on npm — skipping"
          else
            npm publish --access public -w @codecai/web-llm
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── @codecai/maps-cli ──────────────────────────────────────────
      - name: Build @codecai/maps-cli
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'maps-cli' }}
        run: npm run -w @codecai/maps-cli build

      - name: Test @codecai/maps-cli
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'maps-cli' }}
        run: npm test -w @codecai/maps-cli

      - name: Publish @codecai/maps-cli
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'maps-cli' }}
        run: |
          v=$(node -p "require('./packages/maps-cli/package.json').version")
          if npm view @codecai/maps-cli@$v version 2>/dev/null | grep -q "^$v$"; then
            echo "@codecai/maps-cli@$v already on npm — skipping"
          else
            npm publish --access public -w @codecai/maps-cli
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── @codecai/mcp-leaf ──────────────────────────────────────────
      - name: Build @codecai/mcp-leaf
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'mcp-leaf' }}
        run: npm run -w @codecai/mcp-leaf build

      - name: Test @codecai/mcp-leaf
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'mcp-leaf' }}
        run: npm test -w @codecai/mcp-leaf

      - name: Publish @codecai/mcp-leaf
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'mcp-leaf' }}
        run: |
          v=$(node -p "require('./packages/mcp-leaf/package.json').version")
          if npm view @codecai/mcp-leaf@$v version 2>/dev/null | grep -q "^$v$"; then
            echo "@codecai/mcp-leaf@$v already on npm — skipping"
          else
            npm publish --access public -w @codecai/mcp-leaf
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── @codecai/tool-kit ──────────────────────────────────────────
      - name: Build @codecai/tool-kit
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'tool-kit' }}
        run: npm run -w @codecai/tool-kit build

      - name: Test @codecai/tool-kit
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'tool-kit' }}
        run: npm test -w @codecai/tool-kit

      - name: Publish @codecai/tool-kit
        if: ${{ github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'tool-kit' }}
        run: |
          v=$(node -p "require('./packages/codec-tool-kit/package.json').version")
          if npm view @codecai/tool-kit@$v version 2>/dev/null | grep -q "^$v$"; then
            echo "@codecai/tool-kit@$v already on npm — skipping"
          else
            npm publish --access public -w @codecai/tool-kit
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
