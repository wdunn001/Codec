# Publish `codecai` to PyPI on a v* tag, or manually from the Actions
# tab. Uses PyPI Trusted Publishing (OIDC) so no token secret is
# required in the repo — instead, configure PyPI:
#
#   https://pypi.org/manage/project/codecai/settings/publishing/
#   Owner: wdunn001
#   Repository: Codec
#   Workflow: publish-pypi.yml
#   Environment: pypi
#
# If OIDC isn't set up yet, fall back to a `PYPI_API_TOKEN` secret —
# uncomment the env block under "Publish" below and remove the
# `id-token: write` permission.

name: publish-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for PyPI Trusted Publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi  # add a deployment-protected env if you want gating
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Run tests
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio msgpack zstandard brotli
          python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          # Uncomment for token-fallback:
          # user: __token__
          # password: ${{ secrets.PYPI_API_TOKEN }}
